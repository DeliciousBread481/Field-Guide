plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // EMI
    modImplementation "dev.emi:emi-fabric:${emi_version}"

    // Cloth Config
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    modImplementation "com.terraformersmc:modmenu:${mod_menu_version}"

    // Item Descriptions
    modRuntimeOnly "folk.sisby:kaleido-config:${kaleido_config_version}"
    modRuntimeOnly "maven.modrinth:item-descriptions:${item_descriptions_version}-fabric"

    // Immersive Overlays
    modRuntimeOnly "maven.modrinth:immersive-overlays:${immersive_overlays_version}-fabric"

    // Spyglass Improvements
    modRuntimeOnly "maven.modrinth:spyglass-improvements:${spyglass_improvements_fabric_version}+fabric"

    // ETF
    modCompileOnly "maven.modrinth:entitytexturefeatures:${etf_version}-fabric-1.20.1"

    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

publishMods {
    file = tasks.named("remapJar").flatMap { it.archiveFile }
    changelog = rootProject.file("CHANGELOG-LATEST.md").text
    type = STABLE
    displayName = "${mod_name} Fabric ${minecraft_version} - ${project.version}"
    modLoaders.add("fabric")

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "1470590"
        minecraftVersions.add("1.20.1")

        optional { slug = "item-descriptions" }
        optional { slug = "cloth-config" }
        optional { slug = "immersive-overlays" }
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "72RRCWM6"
        minecraftVersions.add("1.20.1")

        optional { slug = "item-descriptions" }
        optional { slug = "cloth-config" }
        optional { slug = "immersive-overlays" }
    }
}