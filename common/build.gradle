plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    mcpVersion = minecraft_version
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}"
    compileOnly "dev.emi:emi-xplat-mojmap:${emi_version}"
    compileOnly "maven.modrinth:kubejs:${kubejs_forge_version}"
    compileOnly "maven.modrinth:entitytexturefeatures:${etf_version}-forge-1.20.1"
    compileOnly "maven.modrinth:entity-model-features:${emf_version}-forge-1.20.1"
    compileOnly "maven.modrinth:reliable-remover:${reliable_remover_version}-forge-1.20.1"
    compileOnly "maven.modrinth:exposure:${exposure_forge_version}"
    compileOnly "com.cobblemon:forge:${cobblemon_version}"
    compileOnly "maven.modrinth:serene-seasons:${serene_seasons_forge_version}"
    compileOnly "maven.modrinth:scholar:yxQA51K6"
    compileOnly "maven.modrinth:item-descriptions:${item_descriptions_version}-forge"

    compileOnly 'org.jetbrains:annotations:26.0.2-1'
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly group: 'org.ow2.asm', name: 'asm-tree', version: '9.6'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}